about: |
  最近我在做训练和运动相关的探索，也在做一个视觉语言模型网关。我还接了一些短剧的后期剪辑，也在试用各种前沿的 Agent 产品。训练上，我在为 HYROX 备赛，也想开始练铁人三项。明年我可能试试标铁（标准距离铁人三项）。

  接下来我会做很多新的、好玩的内容和产品。我开这个网站，是想给它们找一个固定的地方。朋友们也可以在这里看到我最近在做什么。想联系我、认识我，或者对我做的东西感兴趣，这个网站上的信息最完整。

  一句话介绍自己：爱好太多，要做的太多，好玩的太多。
