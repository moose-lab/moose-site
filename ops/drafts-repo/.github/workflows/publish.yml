# Copy this file into the PRIVATE repo moose-lab/moose-drafts (see ops/drafts-repo/README.md in moose-site).
name: 发布草稿
on:
  workflow_dispatch:
    inputs:
      path:
        description: 要发布的文件，例如 src/content/posts/hello.mdx
        required: true
permissions:
  contents: write
concurrency:
  group: publish-draft
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRAFT_PATH: ${{ inputs.path }}
    steps:
      - name: Refuse to run in a public repository
        if: ${{ github.event.repository.private != true }}
        run: |
          echo "::error::moose-drafts 必须是私有仓库，否则草稿对所有人可见。请到 Settings → General → Danger Zone → Change repository visibility 改为 Private。"
          exit 1
      - name: Check out drafts
        uses: actions/checkout@v4
        with:
          path: drafts
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          repository: moose-lab/moose-site
          token: ${{ secrets.MOOSE_SITE_TOKEN }}
          path: site
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Copy the draft into the site
        working-directory: site
        run: node scripts/publish-draft.mjs --drafts ../drafts --site . --path "$DRAFT_PATH"
      - name: Validate (types, tests, full build with Zod)
        working-directory: site
        run: pnpm check && pnpm test && pnpm build
      - name: Publish to main
        working-directory: site
        run: |
          git config user.name "moose-lab"
          git config user.email "196345158+moose-lab@users.noreply.github.com"
          git add src/content
          if git diff --cached --quiet; then
            echo "网站上已经是这个版本，不需要新的提交。"
          else
            git commit -m "content: 发布 $DRAFT_PATH"
            git push
          fi
      - name: Remove the draft
        working-directory: drafts
        run: |
          git config user.name "moose-lab"
          git config user.email "196345158+moose-lab@users.noreply.github.com"
          git rm --quiet "$DRAFT_PATH"
          git commit -m "published: $DRAFT_PATH"
          git push
